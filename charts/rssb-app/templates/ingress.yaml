{{- /*
One Ingress per exposed component, all on the environment's single host:
"/" goes to the frontend, "/api/*" to the backend with the prefix stripped.
The browser only ever talks to that host, which is what lets one frontend
image serve every environment.
*/ -}}
{{- range $name, $comp := .Values.components }}
{{- $c := include "rssb-app.component" (dict "root" $ "name" $name "comp" $comp) | fromYaml }}
{{- if $c.ingress.enabled }}
{{- if not $.Values.global.host }}
{{- fail (printf "components.%s exposes an Ingress, so global.host must be set" $name) }}
{{- end }}
{{- $path := trimSuffix "/" $c.ingress.path }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "rssb-app.labels" (dict "root" $ "name" $name "type" $c.type) | nindent 4 }}
  {{- if or $c.ingress.stripPrefix $c.ingress.longLivedConnections }}
  annotations:
    {{- if $c.ingress.stripPrefix }}
    # {{ $path }}/users -> /users
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- end }}
    {{- if $c.ingress.longLivedConnections }}
    # WebSockets stay open far longer than the 60 s default.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.global.ingressClassName }}
  rules:
    - host: {{ $.Values.global.host }}
      http:
        paths:
          {{- if $c.ingress.stripPrefix }}
          - path: {{ $path }}(/|$)(.*)
            pathType: ImplementationSpecific
          {{- else }}
          - path: {{ $path | default "/" }}
            pathType: Prefix
          {{- end }}
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
