{{- /*
Database migrations, run by Argo CD on every sync BEFORE the new pods roll out.

Ordering within a sync (lower waves first, each must be healthy before the next):
  wave -2  SealedSecrets (unsealed into Secrets)   - set in the environment folder
  wave -1  this Job (Sync hook: runs to completion)
  wave  0  Deployments, Services, Ingress
If the migration fails, the sync stops and the old version keeps running.
*/ -}}
{{- range $name, $comp := .Values.components }}
{{- $c := include "rssb-app.component" (dict "root" $ "name" $name "comp" $comp) | fromYaml }}
{{- if $c.migration.enabled }}
{{- if not $c.migration.command }}
{{- fail (printf "components.%s.migration.enabled needs migration.command" $name) }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "rssb-app.labels" (dict "root" $ "name" (printf "%s-migrate" $name) "type" $c.type) | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ $c.migration.backoffLimit }} # retries cover the DB still starting on a fresh environment
  activeDeadlineSeconds: {{ $c.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "rssb-app.podLabels" (dict "root" $ "name" (printf "%s-migrate" $name) "type" $c.type) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "rssb-app.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "rssb-app.image" $c }} # same image (and digest) as the app
          command:
            {{- toYaml $c.migration.command | nindent 12 }}
          {{- with include "rssb-app.envFrom" (dict "name" $name "c" $c) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "rssb-app.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
