# Defaults for rssb-app. An environment's values file only sets what differs.
#
# How a component's settings are built (later wins):
#   componentDefaults  ->  typeDefaults.<type>  ->  components.<name>

# Read by Argo CD's ApplicationSet to pick the chart version for this
# environment; Helm itself ignores it.
chart:
  version: ""

# Value of the app.kubernetes.io/part-of label. Defaults to the release name.
partOf: ""

global:
  # Public host for this environment. "/" and "/api" routes hang off it.
  host: ""
  ingressClassName: nginx
  # Names of existing docker-registry Secrets (sealed in the environment folder).
  imagePullSecrets: []

# Applied to every component.
componentDefaults:
  replicas: 1
  # Optional HPA. When enabled, `replicas` is ignored and the HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 384Mi
  # Non-secret environment variables (become a ConfigMap; changing one rolls the pods).
  env: {}
  # Names of existing Secrets to load as environment variables.
  secretRefs: []
  # Seconds the pod keeps serving after it is removed from the Service, so the
  # Ingress stops routing to it before SIGTERM arrives.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # The root filesystem is read-only; these paths get an empty writable volume.
  writablePaths: []
  # Spread replicas across nodes, so losing one node keeps the component up.
  spreadAcrossNodes: false
  ingress:
    enabled: false
    path: /
    # true: /api/users reaches the app as /users
    stripPrefix: false
    # true: keep connections open for an hour (WebSockets / Socket.io)
    longLivedConnections: false
  # Database migrations, run by Argo CD before the new pods roll out (see
  # templates/migration-job.yaml).
  migration:
    enabled: false
    command: []
    activeDeadlineSeconds: 600
    backoffLimit: 6

# Defaults per type of app. A component picks one with `type:`.
typeDefaults:
  nestjs:
    probes:
      # Startup: up to 60 s to boot before liveness may restart it.
      startup: { path: /health, periodSeconds: 2, failureThreshold: 30 }
      # Liveness: process alive? No dependency checks, or a DB outage would
      # restart every pod for nothing.
      liveness: { path: /health, periodSeconds: 10, failureThreshold: 3 }
      # Readiness: can it serve (DB reachable)? Failing pods get no traffic.
      readiness: { path: /health/readiness, periodSeconds: 5, failureThreshold: 3 }
    writablePaths: [/tmp]
  nextjs:
    probes:
      startup: { path: /, periodSeconds: 2, failureThreshold: 30 }
      liveness: { path: /, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /, periodSeconds: 5, failureThreshold: 3 }
    # The only path Next.js writes to at runtime.
    writablePaths: [/app/.next/cache]
    spreadAcrossNodes: true
    ingress:
      enabled: true
      path: /

# One entry per deployable part of the product, e.g.:
#
# components:
#   backend:
#     type: nestjs
#     image:
#       repository: ghcr.io/devops-canary/logistics-backend
#       digest: sha256:...   # CI writes this line
#     port: 3001
#     secretRefs: [backend-secrets]
#     ingress: { enabled: true, path: /api, stripPrefix: true }
components: {}
